[package]
name = "wist-cred"
version = "0.6.3" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "凭据服务（C）：为程序签发 / 撤销脚本与 break-glass 凭据，只存 sha256 摘要，向验证方推送 register / revoke"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 凭据摘要：只存 sha256，明文从不落盘。
sha2 = "0.10"
# 凭据明文的高熵随机源。
getrandom = "0.3"
# 推送：双向 TLS 客户端（客户端证书由 CA-I 签，服务端证书用 CA-S 信任锚校）。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "1.1"
# 与 center / gwlinkd / ingest-ctrl 同一套 PKI 原语：CA 按 CSR 签、主体由 CA 填、
# notBefore 回拨 300s、随机序列号。**不自己另写一套。**
wist-pki = "0.1.2"
# 配置里的 `${SEC_...}`：与其它服务同口径（env 优先，其次 `.galaxy/sec_value.yml`）。
orion-sec = "0.7"
orion-variate = "0.14"
# 管理凭据的比对原语（与控制台 / center / gwlinkd 同一套）：
# `bearer_token` + `token_matches`（sha256 常量时间比较）。**不自己另写一份。**
#
# 多 crate 联调口径与 dev-dependency 一致：用**本地 path**（仓组同级摆放），
# 不在 runtime 引入一份 registry 副本 —— 否则两处版本一漂，“验的人”和“签的人”就会说两套话。
# 镜像由 release 用**预编译二进制**打（docker/Dockerfile），不依赖这份 path。
wist-auth = { path = "../wist-auth", default-features = false, features = ["credential", "signing"] }

[dev-dependencies]
http-body-util = "0.1"
# 测试里现生成 Ed25519 钥，验证推送载荷的签名契约。
ring = "0.17"
# 测试里要造真的 CSR（与 gwlinkd 同一套：私钥不上送，只交公钥）。
rcgen = { version = "0.13", features = ["pem"] }
tower = { version = "0.5", features = ["util"] }
# 验证侧的真实实作（闭环测试要拿它验，不是一个 mock）。
# 同一个 path：features 相加不冲突（runtime 不带 credential，测试才带）。
wist-auth = { path = "../wist-auth", default-features = false, features = ["credential"] }
# 端到端要一个**真的签发 CA**（测试里现场生成，不落仓库）。与运行期同一个源，
# 否则 cargo 会报「same crate, different source paths」。
wist-pki = "0.1.2"
# 示例验证方依赖**已发布**的 `wist-cred-peer`（不引本地 path）：它就是“下游怎么接”的样板。
# 它只用于 example / 镜像 `wist-cred-example`，不进服务二进制。
# 0.2：支持授权记录验签（`--issuer-public-key`）。
wist-cred-peer = "0.2"

# 示例验证方（X）：一个真能跑的双向认证服务，release 会把它打成 `wist-cred-example` 镜像。
[[example]]
name = "peer_example"
path = "examples/peer_example.rs"
