# wist-cred 配置示例 —— 复制成 `cred.toml`（或用 `WIST_CRED_CONFIG` 指过去），按现场改。
#
# 密钥走 `${SEC_...}`：由 `WIST_CRED_SEC_FILE` 指向的 yml 解析（与 center / console 同口径）。
#
# 两条**加载期就会拒绝启动**的约束（设计文档 §3.4 的 S1 / S2）：
#   1. `mode = "ingress"` 时 `listen_addr` 不能是 `0.0.0.0` / `[::]` —— 同一份代码绑到公网就是后门；
#   2. `mode = "ingress"` 时 `trusted_peers` 不能为空 —— 否则等于谁都能注入操作者头。

[server]
# 人机面：内网反代 / 跳板之后。绑**私网地址**，不要 0.0.0.0。
listen_addr = "10.0.20.11:8443"
# 页面由 `wist-cred-web` 提供，它调本服务的 `/api/v1/credentials`。
mode = "ingress"
ingress_header = "x-wist-operator"
# 只认这些对端：内网反代 / 跳板 / 同机 socket。
trusted_peers = ["10.0.20.10/32", "127.0.0.1/32", "unix:/run/wist/cred.sock"]

# 阶段二（**现在不做**）：接用户中心 / 钉钉 OIDC。页面与授权逻辑不变，只换认证来源。
# 注意：写出来会**直接拒绝启动**，而不是静默退化成不校验。
# mode = "oidc"

[storage]
# 自己的小表。**不复用 center 的 PG** —— 那个库在接入区，跨区依赖会把两边一起拖下水。
path = "state/credentials.db"

[issue]
digest = "sha256"
max_ttl_seconds = 2592000              # 30d（脚本）
break_glass_max_ttl_seconds = 7776000  # 90d
overlap_seconds = 300

# ── 推送：一套身份，所有认证系统共用 ────────────────────────────────────
# 两个方向不是同一把 CA：client_* 由 CA-I 签（证明"我是 cred"），
# ca 是 CA-S 信任锚（校 X 的服务器证书）。
# 没有这一段 = 不推送（全靠手工分发），心跳也不会跑。
#
# [push]
# client_cert = "/etc/wist/cred/client.crt"
# client_key  = "/etc/wist/cred/client.key"
# ca          = "/etc/wist/cred/ca-s.crt"
# timeout_seconds = 10

# ── 认证系统（验证方 X）───────────────────────────────────
#
# 认证系统**不是配置项**：它们落在 `store_path` 指向的注册表（运行期可写，页面可建）。
# 下面只是它的**部署种子目录**：`scripts/gen-pki.sh` 写出 `<name>/peer.json`，
# 启动时导入一次；注册表里已有的条目不覆盖。
#
# 口径与 center ↔ gwlinkd 入场一致：
#   · X 在**本机**生成密钥对，私钥永不上送；
#   · 只交 CSR（只含公钥），本服务按 CSR 签；
#   · 证书主体（CN / DNS SAN）由本服务按 `peer.json` 的 host 填，CSR 声明一律忽略。
#
# `ca_cert` / `ca_key` 是签 X 服务器证书的那把 CA（CA-S），必须与 `[push].ca` 同源。
# `client_ca` 是 CA-I 的公开证书，交给 X 当信任锚（验 cred 的客户端证书）。
#
# [onboarding]
# dir = "/wist-cred/identity/onboarding"
# store_path = "/wist-cred/state/peers.json"
# script_ttl_seconds = 900          # 一次性接入券，上限 3600
# ca_cert = "/wist-cred/identity/ca-s.crt"
# ca_key  = "/wist-cred/identity/ca-s.key"
# client_ca = "/wist-cred/identity/ca-i.crt"
# peer_cert_ttl_seconds = 7776000   # 签给 X 的服务器证书有效期（90d）
# heartbeat_seconds = 30            # 心跳间隔；0 = 关闭
