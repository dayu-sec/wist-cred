name: Build & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened]
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: wist-cred
    steps:
      - name: Checkout wist-cred
        uses: actions/checkout@v7
        with:
          path: wist-cred

      # 闭环用例（`examples/closed_loop.rs` 与 api 的单测）用的是**验证侧的真实实现**，
      # dev-dependency 走本地 `../wist-auth`。所以按仓组摆成同级目录。
      # `ref: main` 是**浮动**的：验证侧改了语义会在这里先红（这正是想要的信号）；
      # 要可复现就改成发布出来的 tag（如 `ref: v0.2.0`）。
      - name: Checkout wist-auth（验证侧实现）
        uses: actions/checkout@v7
        with:
          repository: dayu-sec/wist-auth
          ref: main
          path: wist-auth

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo build (release)
        run: cargo build --release --all

      - name: Cargo test (release)
        run: cargo test --release --all
